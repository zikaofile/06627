<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>馨美装修二维码名片</title>
		<style>
			body {
				font-size: 14px;
			}
			/*清除浏览器的默认样式*/
			body,
			dl,
			dt,
			dd {
				padding: 0;
				margin: 0;
				border: 0;
			}
			dl {
				width: 170px;
				height: 240px;
				border: 10px solid #f1e9e9;
				padding: 10px;
				margin: 10px;
			}
			dt {
				width: 170px;
				height: 162px;
				background: url(images/webchat.jpg) no-repeat -17px center;
				margin-bottom: 5px;
			}
			dd {
				width: 170px;
				height: 26px;
				line-height: 26px;
				color: #666;
				padding-left: 5px;
			}
			.poo1 {
				font-weight: bold;
				font-size: 16px;
			}
			.poo2 {
				font-size: 18px;
			}
		</style>
	</head>
	<body>
		<dl>
			<dt></dt>
			<dd><span class="poo1">公司</span>&nbsp;<span class="poo2">馨美装修</span></dd>
			<dd>电话：13512345678</dd>
			<dd>联系人：海阔天空</dd>
		</dl>
	</body>
</html>
