<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>一栏布局(通栏)</title>
		<style type="text/css">
			body {
				margin: 0;
				padding: 0;
				font-size: 24px;
				text-align: center;
			}

			div {
				width: 980px;
				/*设置所有模块的宽度为980px、居中显示*/
				margin: 5px auto;
				background: #D2EBFF;
			}
			/*头部只设置高度*/
			#header {
				height: 40px;
			}
			/*设置导航（nav）、焦点图（banner）和内容（content）的宽度一样*/
			#nav {
				width: 800px;
				height: 60px;
			}
			#banner {
				width: 800px;
				height: 200px;
			}
			#content {
				width: 800px;
				height: 200px;
			}
			/*底部只设置高度*/
			#footer {
				height: 90px;
			}
		</style>
	</head>
	<body>
		<div id="header">头部</div>
		<div id="nav">导航栏</div>
		<div id="banner">焦点图</div>
		<div id="content">内容</div>
		<div id="footer">页面底部</div>
	</body>
</html>
