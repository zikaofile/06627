<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>伪元素示例</title>
		<style type="text/css">
			h4:first-letter {color: #ff0000;font-size: 36px;}
			p:first-line {color: #ff0000;}
			/* 被选中的字行（鼠标选中的字段） */
			p::selection {background: yellow;}
		</style>
	</head>
	<body>
		<h4>馨美装修公司介绍</h4>
		<p>人民对美好生活的向往，就是我们的奋斗目标。在这里，创业的氛围让每个人都积极创新，为做出美好的事情而努力。</p>
	</body>
</html>
