<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>使用行内样式</title>
	</head>
	<body>
		<div style="width:500px; border:1px dashed #00f;">
			<!--行内定义的h3样式，不影响其他h3标题-->
			<h3 style="font-size:30pt;color:purple;text-align:center">馨美装修系列赏析</h3>
			<!--行内定义的h3样式，不影响其他h3标题-->
			<h3 style="font-size:13pt;color:blue;text-align:center">温馨系列</h3>
			<h3 style="text-align:right">发布：张小兵</h3>
			<p style="text-align:center"><img src="images/home.jpg" /></p>
			<!--下面的段落文字为11磅大小，蓝色,不影响其他段落-->
			<p style="font-size:11pt; color:blue">温馨系列装修由专业团队精心设计，采用最新绿色环保材质制作，精致的工艺带给你卓越的体验感和品质感。</p>
			<!--下面的段落不受影响，仍然为默认显示-->
			<p>选择馨美装修，享受一流的服务和专业的指导。</p>
		</div>
	</body>
</html>
