<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>导入外部样式表</title>
			<style type="text/css">
				@import url(style/extstyle.css);
				.bgcolor{ color: black; background:#ffc}  /* 定义类，字体为黑色；背景为浅黄色 */
			</style>
	</head>
	<body>
		<div>
			<h3 class="bgcolor">馨美装修系列赏析</h3>  <!-- 由内部样式表.bgcolor决定，背景显示为浅黄色，而不是外部样式表中定义的蓝色 -->
			<!--下面的标题3中使用了行内样式，其优先级别高于导入的外部样式表-->
			<h3 style="font-size:13pt;color:blue;text-align:center">温馨系列</h3>
			<p class="author">发布：张小兵</p>
			<p class="img"><img src="images/home.jpg" /></p>
			<p class="content">温馨系列装修由专业团队精心设计，采用最新绿色环保材质制作，精致的工艺带给你卓越的体验感和品质感。</p>
			<!--下面的段落中使用了行内样式，其优先级别高于导入的外部样式表-->
			<p style="color:purple">选择馨美装修，享受一流的服务和专业的指导。</p>
		</div>
	</body>
</html>
