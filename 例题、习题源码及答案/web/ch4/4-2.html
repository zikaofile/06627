<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>内部样式表实例</title>
		<style type="text/css">
			body {font-size:11pt}
			div{width:500px; border:1px dashed #00f;}
			h1 {font-size:30pt;color:purple;text-align:center}   /*修改标题1的样式*/
			h1.title {font-size:13pt;color:blue;text-align:center}
			p {font-size:11pt;color:black}
			p.author{color:blue;text-align:right}
			p.img{text-align:center}
			p.content{color:blue}
			p.note{color:green;text-align:left}
		</style>
	</head>
	<body>
		<div> 
			<h1>馨美装修系列赏析</h1> 
			<p>2022年3月2日至3月5日，举办温馨系列装修优惠活动，享受最高优惠，欲购从速。</p>
			<h1 class="title">温馨系列</h1>
			<p class="author">发布：张小兵</p>
			<p class="img"><img src="images/home.jpg" /></p>
			<p class="content">温馨系列装修由专业团队精心设计，采用最新绿色环保材质制作，精致的工艺带给你卓越的体验感和品质感。</p>
			<p class="note">选择馨美装修，享受一流的服务和专业的指导。</p>
		</div>
  </body>
</html>
