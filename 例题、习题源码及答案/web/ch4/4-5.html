<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>“交集”选择符示例</title>
		<style type="text/css">
			p {
				font-size: 14px;
				/*定义文字大小*/
				color: #00F;
				/*定义文字颜色为蓝色*/
				text-decoration: underline;
				/*让文字带有下划线*/
			}
			.myContent {
				font-size: 20px;
				/*定义文字大小为18px*/
				text-decoration: none;
				/*让文字不再带有下划线*/
				border: 1px solid #C00;
				/*设置文字带边框效果*/
			}
		</style>
	</head>
	<body>
		<p>1.“交集”选择符示例</p>
		<p class="myContent">2.“交集”选择符示例</p>
		<p>3.“交集”选择符示例</p>
	</body>
</html>
