<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>伪类示例</title>
		<style type="text/css">
			a:link {color: blue;} /*超链接单击之前是蓝色*/
			a:visited {color: red;} /*超链接单击之后是红色*/
			/*鼠标悬停是绿色，较大的字体，背景是黄色*/
			a:hover {color: green;font-size: large;background-color: yellow;}			
			/*鼠标单击链接，但是不松手的时候，字体是白色，背景是蓝紫色*/
			a:active {color: white;background-color: blueviolet;}
		</style>
	</head>
	<body>
		<p>人民对美好生活的向往，就是我们的奋斗目标。在这里，创业的氛围让每个人都积极创新，为做出美好的事情而努力。<br />
			<hr />
			<a href="#">馨美装修宣传部</a>
		</p>
	</body>
</html>
