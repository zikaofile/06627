<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>边框的复合属性</title>
		<style type="text/css">
			h1 { border: 2px solid red; text-indent: 2em;}
			.pa { border-bottom: red dashed 3px; border-top: blue double 3px;}
			.box { border-bottom: 25px solid red; border-left: 25px solid yellow;
				border-right: 25px solid blue; border-top: 25px solid green; }
		</style>
	</head>
	<body>
		<h1>简约装修风格</h1>
		<p>简约装修风格</p>
		<p style="border: coral dashed 5px">简约装修风格</p>
		<p class="pa">简约装修风格</p>
		<p class="box">简约装修风格</p>
	</body>
</html>
