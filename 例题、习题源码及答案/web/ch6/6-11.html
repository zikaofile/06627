<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>clip属性示例</title>
		<style type="text/css">
			img{
				 width:300px; height:187px;
			}
		</style>
	</head>
	<body>
		<img src="images/home.jpg">
		<img src="images/home.jpg" style="position: absolute;clip:rect(50px 200px 150px 20px); ">
	</body>
</html>
