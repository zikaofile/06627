<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>box-shadow属性</title>
		<style type="text/css">
			img {
				border: 1px solid #666;
				border-radius: 50%;				/*将图像设置为圆形效果*/
				padding: 20px;				/*内边距20px，让图像和阴影之间拉开一定距离，避免图片遮挡阴影*/
				box-shadow: 5px 5px 10px 2px #999 inset;	/*内阴影效果*/
			}
		</style>
	</head>
	<body>
		<img src="images/home.jpg" alt="简约装修" />
	</body>
</html>
