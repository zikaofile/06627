<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>resize属性示例</title>
		<style type="text/css">
			div { border: 2px solid;	padding: 10px 30px;
				width: 360px; overflow: auto; }
		</style>
	</head>
	<body>
		<div>resize 属性规定是否可由用户调整元素尺寸。</div>
		<hr />
		<div style="resize: both; cursor: se-resize;">可以调整宽度和高度</div>
		<hr />
		<div style="resize: horizontal; cursor: ew-resize;">可以调整宽度</div>
		<hr />
		<div style="resize: vertical;cursor: ns-resize;">可以调整高度</div>
	</body>
</html>
