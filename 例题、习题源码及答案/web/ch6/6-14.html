<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>静态定位</title>
		<style type="text/css">
			body { margin: 20px;  /*页面整体外边距为20px*/ }
			#father {background-color: #a0c8ff;  /*父容器的背景为蓝色*/
				border: 1px dashed #000000;  /*父容器的边框为1px黑色实线*/
				padding: 10px;  /*父容器内边距为10px*/  }
			#box1 {
				background-color: #fff0ac;  /*盒子的背景为黄色*/
				border: 1px dashed #000000;  /*盒子的边框为1px黑色实线*/
				padding: 20px;  /*盒子的内边距为10px*/  }
		</style>
	</head>
	<body>
		<h2>这是一个没有定位的标题</h2>
		<div id="father">
			<div id="box1">盒子1</div>
		</div>
	</body>
</html>
