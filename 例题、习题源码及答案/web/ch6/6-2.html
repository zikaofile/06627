<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>内边距</title>
		<style type="text/css">
			div {
				width: 302px;	/*容器内容宽度302px=图像的宽度+图像的左右边框宽度*/
				border: 2px solid red;	/*容器边框为2px红色实线*/
				padding: 10px 20px;	/*容器上、下内边距为10px，左、右内边距为20px*/
			}
			img {
				width: 300px;			/*图像宽度为300px*/
				height: 187px;
				border: 1px solid blue;		/*图像边框宽度为1px*/
			}
			p {
				padding:20px;			/*段落四周的内边距都为20px*/
				border:2px dashed #09f;	/*段落边框为2px蓝色虚线*/
			}
		</style>
	</head>
	<body>
		<div><img src="images/home.jpg" /></div>
		<p>简约装修风格</p>
	</body>
</html>
