<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>边框的样式属性</title>
		<style type="text/css">
			p {	margin: 20px; /*外边距为20px*/
				border-width: 5px; *边框宽度为6px*/
				border-color: #000000; /*边框颜色为黑色*/
				padding: 5px; /*内边距为5px*/
				background-color: #FFFFCC; /*淡黄色背景*/
			}
		</style>
	</head>
	<body>
		<p style="border-style:none">无边框none</p>
		<p style="border-style:hidden">无边框hidden</p>
		<p style="border-style:dotted">点线边框dotted</p>
		<p style="border-style:dashed">虚线边框dashed</p>
		<p style="border-style:solid">实线边框solid</p>
		<p style=" border-style:double">双线边框double</p>
		<p style="border-style:groove">3D凹槽边框groove</p>
		<p style="border-style:ridge">3D凸槽边框ridge</p>
		<p style="border-style:inset">3D凹入边框inset</p>
		<p style="border-style:outset">3D凸起边框outset</p>
		<p style="border-style:inherit">从父元素继承边框样式inherit</p>
	</body>
</html>
