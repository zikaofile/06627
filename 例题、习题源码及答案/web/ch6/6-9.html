<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>CSS浮动</title>
		<style type="text/css">
			img { width: 100px; height: 62px; }
		</style>
	</head>
	<body>
		<p>这里是演示文字<img src="images/home.jpg" >这里是演示文字…</p>
		<p>这里是浮动框外围的演示文字<img src="images/home.jpg" style="float: left;">这里是浮动框外围的演示文字…</p>
		<p>这里是浮动框外围的演示文字<img src="images/home.jpg" style="float: right;">这里是浮动框外围的演示文字…</p>
	</body>
</html>
