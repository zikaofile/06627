        <h2>抽象艺术</h2>
        <p>抽象艺术指艺术形象较大程度偏离或完全抛弃自然对象外观的艺术。抽象艺术一般被认为是一种不描述自然世界的艺术，它透过形状和颜色，以主观方式来表达。抽象一词原义指人类对事物非本质因素的舍弃与对本质因素的抽取。一部分原始艺术品和大部分工艺美术作品以及书法、建筑等艺术样式，就其形象与自然对象的偏离特征来说应属抽象艺术。但作为自觉的艺术思潮的抽象艺术则在20世纪兴起于欧美。诸多现代主义艺术流派如抽象表现主义、立体主义、塔希主义等均受此影响。</p>
