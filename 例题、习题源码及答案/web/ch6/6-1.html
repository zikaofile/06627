<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>块级元素与行级元素宽度和高度的区别</title>
		<style type="text/css">
			.special {
				border: 1px solid #036;
				/*元素边框为1px蓝色实线*/
				width: 300px;
				/*元素宽度200px*/
				height: 100px;
				/*元素高度200px*/
				background: #ccc;
				/*背景色灰色*/
				margin: 5px;
				/*元素外边距5px*/
				/*display: block;*/
				/*块级元素显示*/
			}
		</style>
	</head>
	<body>
		<div class="special">这是div元素</div>
		<span class="special">这是span元素</span>

	</body>
</html>
