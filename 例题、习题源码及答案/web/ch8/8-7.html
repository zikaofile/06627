<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>确认框</title>
	</head>
	<body>
		<script>
			var userChoice = window.confirm("请选择“确定”或“取消”");
			if(userChoice == true) {
				document.write("OK!");
			}
			if(userChoice == false) {
				document.write("Cancel!");
			}
		</script>
	</body>
</html>
