<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>while循环求和</title>
	</head>
	<body>
		<script language="JavaScript">
			var i = 1;
			var sum = 0;
			while (i <= 100) {
				sum = sum + i;
				i++;
			}
			document.write("1+2+3+…+100=" + sum);
		</script>
	</body>
</html>
