<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>设置计时器</title>
		<script type="text/javascript">
			function hello() {
				window.alert("欢迎您！");
			}
			window.setTimeout("hello()", 5000); //延时5000ms后再调用hello()函数
			window.alert("窗口的宽="+window.innerWidth); //获得窗口的宽度
			window.alert("窗口的高="+window.innerHeight); //获得窗口的高度
		</script>
	</head>
	<body>
	</body>
</html>
