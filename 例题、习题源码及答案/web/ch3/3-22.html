<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>表单分组</title>
	</head>
	<body>
		<form>
			<fieldset>
				<legend>请选择个人爱好</legend>
				<input type="checkbox" name="like" value="音乐">音乐
				<input type="checkbox" name="like" value="上网" checked>上网
				<input type="checkbox" name="like" value="足球">足球
				<input type="checkbox" name="like" value="下棋">下棋
			</fieldset>
			<br />
			<fieldset>
				<legend>请选择个人课程选修情况</legend>
				<input type="checkbox" name="choice" value="computer" />计算机 <br />
				<input type="checkbox" name="choice" value="math" />数学 <br />
				<input type="checkbox" name="choice" value="chemical" />化学 <br />
			</fieldset>
		</form>
	</body>
</html>
