<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>不同类型的input元素</title>
	</head>
	<body>
		<form action="" method="">
			帐号: <input type="text" name="user" size=30 /><br />
			密码: <input type="password" name="passwd" size=30 /><br />
			性别: <input type="radio" name="sex" vlaue="male" /> 男
			<input type="radio" name="sex" value="female" checked="checked" />女<br />
			爱好: <input type="checkbox" name="like" value="java" />下棋
			<input type="checkbox" name="like" value="html" />游泳
			<input type="checkbox" name="like" value="css" />足球<br />
			喜欢的颜色: <input type="color" name="favcolor"><br>
			出生日期: <input type="date" name="bday"><br />
			年龄(15到60之间): <input type="number" name="age" min="15" max="60"><br />
			工作年限: <input type="range" name="points" min="1" max="50"><br />
			博客地址：<input type="url" name="blog" placeholder="您的博客地址"><br /><br />
			<input type="reset" />&nbsp;&nbsp;<input type="submit" />&nbsp;&nbsp;<input type="reset" value="自定义按钮" />&nbsp;&nbsp;<input type="image" src="images/ClickEnter.jpg" width="80" height="25">
		</form>
	</body>
</html>
