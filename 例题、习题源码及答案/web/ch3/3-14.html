<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>跨行跨列表格示例</title>
	</head>
	<body>
		<table width="300" border="2">
			<tr>
				<td colspan="3">公司业绩(万元)</td><!--设置单元格水平跨3列-->
			</tr>
			<tr>
				<td rowspan="2">2022年</td><!--设置单元格垂直跨2行-->
				<td>工程装修</td>
				<td>8900</td>
			</tr>
			<tr>
				<td>家庭装修</td>
				<td>9200</td>
			</tr>
			<tr>
				<td rowspan="2">2021年</td><!--设置单元格垂直跨2行-->
				<td>工程装修</td>
				<td>8500</td>
			</tr>
			<tr>
				<td>家庭装修</td>
				<td>8600</td>
			</tr>
	</body>
</html>
