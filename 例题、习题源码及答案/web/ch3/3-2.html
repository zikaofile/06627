<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>使用iframe框架元素实现页面间的跳转</title>
	</head>
	<body>
			<h1>导航条</h1>
			<p><a href="http://www.bing.com" target="mainFrame">必应</a><br /><br />
			<a href="http://www.taobao.com" target="mainFrame">淘宝</a><br /><br />
			<a href="http://www.sina.com.cn" target="mainFrame">新浪</a><br />
			</p>
			<iframe name="mainFrame" width="800px" height="150px" />
	</body>
</html>
