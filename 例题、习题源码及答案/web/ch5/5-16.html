<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>设置超链接样式</title>
		<style type="text/css">
			<style type="text/css">
				body { margin: 20px; }
				a { font-family: Arial; margin: 5px; }
				a:link, a:visited { color: #008000; padding: 4px 10px 4px 10px;
				background-color: #DDDDDD; text-decoration: none;
				border-top: 1px solid #EEEEEE; border-left: 1px solid #EEEEEE;
				border-bottom: 1px solid #717171; border-right: 1px solid #717171; }
				a:hover { color: #821818; padding: 5px 8px 3px 12px; background-color: #CCC;
				border-top: 1px solid #717171; border-left: 1px solid #717171;
				border-bottom: 1px solid #EEEEEE; border-right: 1px solid #EEEEEE; }
		</style>
	</head>
	<body>
		<a href="#">公司首页</a>
		<a href="#">合作案例</a>
		<a href="#">新闻中心</a>
		<a href="#">人才招聘</a>
		<a href="#">关于我们</a>
	</body>
</html>
