<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>设置背景图像</title>
		<style type="text/css">
			body { /*整个网页的背景图片*/
				background-image: url(images/flower.png);
			}
			div { /*分区的背景图片*/
				background-image: url(images/home.jpg);
				width: 400px;
				height: 250px;
				border: 2px dashed cyan;
			}
		</style>
	</head>
	<body>
		<div>馨美装修精品赏析
		</div>
	</body>
</html>
