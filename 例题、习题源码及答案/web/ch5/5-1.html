<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>字体属性</title>
		<style type="text/css">
			h2 { font-family: 黑体;  /*设置字体类型*/ }
			p { font-family: Arial, "Times New Roman"; font-size: 12pt;  /*设置字体大小*/ }
			.one { font-weight: bold;  /*设置字体为粗体*/  font-size: 20px; }
			.two { font-weight: 400;  /*设置字体为400粗细*/  font-size: 20px; }
			.three { font-weight: 900;  /*设置字体为900粗细*/  font-size: 20px; }
			p.italic { font-style: italic;  /*设置斜体*/ }
		</style>
	</head>
	<body>
		<h2>馨美装修有限公司</h2>
		<p>馨美装修公司是一家集<span class="one">装饰设计</span>、施工、家具、软装等为一体的整体家居企业。<span class="two">历经短短5年时间的发展</span>，品牌已覆盖成都、济南、大连、广州、苏 州等全国25个一线核心城市。</p>
		<p class="italic">人民对美好生活的向往，就是我们的<span class="three">奋斗目标</span>。在这里，创业的氛围让每个人都积极创新，为做出美好的事情而努力。</p>
	</body>
</html>
