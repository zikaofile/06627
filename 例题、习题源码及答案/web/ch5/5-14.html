<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>设置图像的不透明度</title>
		<style type="text/css">
			#boxwrap { width: 1210px;margin: 10px auto;
				border: 2px dashed #fd8e47; }
			img:first-child { opacity: 1; }
			img:nth-child(2) { opacity: 0.6; }
			img:nth-child(3) { opacity: 0.2; }
		</style>
	</head>
	<body>
		<div id="boxwrap">
			<img src="images/home.jpg">
			<img src="images/home.jpg">
			<img src="images/home.jpg">
		</div>
	</body>
</html>
