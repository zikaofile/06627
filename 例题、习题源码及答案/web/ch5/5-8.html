<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>设置列表类型</title>
		<style>
			body {
				background-color: ivory;
			}
			ul {
				font-size: 1.5em;
				color: blue;
				list-style-type: square;
				/* 标记是实心正方形*/
			}
			li.special {
				list-style-type: circle;
				/* 标记是空心圆形*/
			}
		</style>
	</head>
	<body>
		<h2>装修风格</h2>
		<ul>
			<li>国风风格</li>
			<li>简约风格</li>
			<li class="special">欧式风格</li>
			<li>田园风格</li>
		</ul>
	</body>
</html>
