<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<style type="text/css">
			body { background-color: ivory; }
			ul{font-size:1.5em;color:blue;list-style-type:none; /*设置列表类型为不显示任何符号*/}
			li { padding-left: 30px; /*设置左内边距，目的是为背景图像留出位置*/
			background: url(images/smilingface.gif) no-repeat left center;/*背景图像无重复，位置左侧居中*/
			line-height:40px;/*设置行高，避免行之间的内容拥挤*/
			}
		</style>
	</head>
	<body>
		<h2>装修风格</h2>
		<ul>
			<li>国风风格</li>
			<li>简约风格</li>
			<li>欧式风格</li>
			<li>田园风格</li>
		</ul>
	</body>
</html>
