<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>短语元素示例</title>
	</head>
	<body>
		<p>em标签告诉浏览器把文本表示为强调的内容，<em>用斜体来显示。</em></p>
		<p> strong强调的程度更强一些，<strong>用粗的字体来显示。</strong></p>
		<p><code>
				<pre>
	PI = 3.1415926
	r = int(input('r='))  #请输入 <kbd>100</kbd> , 其中变量 <var>r</var> 表示圆的半径
	s = PI*r**2
	print('s=', s)
				</pre>
			</code>
		</p>
		<p>She said <q>I didn't know.</q></p>
		<p>一打有 <del>20</del> <ins>12</ins> 件。</p>
	</body>
</html>
