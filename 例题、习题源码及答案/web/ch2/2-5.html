<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>time元素的使用</title>
	</head>
	<body>
		<p>我每天早上<time>7:00</time>起床</p>
		<p>今年的<time datetime="2022-03-11">3月11日</time>是我的生日</p>
		<time datetime="2022-03-11" pubdate="pubdate">
			本消息发布于2022年3月11日
		</time>
	</body>
</html>
