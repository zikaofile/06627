<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>拖放</title>
		<style type="text/css">
			#div1 {
				/*目标矩形的样式*/
				width: 300px;
				height: 130px;
				padding: 10px;
				border: 1px solid #aaaaaa;
				/*边框为1px浅灰色实线边框*/
			}
		</style>
		<script type="text/javascript">
			function allowDrop(ev) {
				ev.preventDefault(); //设置允许将元素放置到其他元素中
			}

			function drag(ev) {
				ev.dataTransfer.setData("Text", ev.target.id); //设置被拖动元素的数据类型和值
			}

			function drop(ev) { //当放置被拖动元素时发生drop事件
				ev.preventDefault(); //设置允许将元素放置到其他元素中
				var data = ev.dataTransfer.getData("Text"); //从dataTransfer对象读取被拖动元素的数据
				ev.target.appendChild(document.getElementById(data));
			}
		</script>
	</head>
	<body>
		<p>拖动图片到矩形框中</p>

		<div id="div1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
		<br>
		<img id="drag1" src="images/home.jpg" draggable="true" ondragstart="drag(event)" width="200" height="125">


	</body>
</html>
